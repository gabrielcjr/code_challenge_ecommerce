name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start Docker Compose
        run: |
          docker compose up -d --build
          sleep 5

      - name: Run Linters
        run: |
          docker compose exec -T web make run-check-linters

      - name: Verify the app boots and serves without manual setup
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            [ "$status" = "200" ] && break
            sleep 2
          done
          test "$status" = "200"
          docker compose exec -T web python manage.py shell -c \
            "from apps.products.models import Product; assert Product.objects.exists()"

      - name: Run Tests
        run: |
          docker compose exec -T web python manage.py test --verbosity=2
        env:
          DJANGO_SECRET_KEY: test-secret-key-ci

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose down
