name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting with black
        run: black --check . --config pyproject.toml

      - name: Check imports with isort
        run: isort . --check-only --settings-file pyproject.toml

      - name: Lint with flake8
        run: flake8 . --config .flake8 --count --show-source --statistics

      - name: Run migrations
        run: python manage.py migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecommerce
          DJANGO_SECRET_KEY: test-secret-key-ci

      - name: Run tests
        run: python manage.py test --verbosity=2
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ecommerce
          DJANGO_SECRET_KEY: test-secret-key-ci
