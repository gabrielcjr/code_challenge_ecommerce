{% extends "base.html" %}
{% block title %}Products - Enterprise Shop{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Products</h1>
            <p class="mt-1 text-sm text-zinc-600">Manage inventory, search with trigram optimization, import via CSV.</p>
        </div>
        <div class="flex items-center gap-2 text-sm text-zinc-500">
            <span class="inline-flex items-center gap-1 rounded-full bg-zinc-100 px-3 py-1 font-medium">{{ total }} total</span>
        </div>
    </div>

    <div class="rounded-xl border border-zinc-200 bg-white p-4 shadow-sm">
        <form id="filter-form" hx-get="/search/" hx-target="#product-table-container" hx-swap="innerHTML" hx-trigger="change delay:200ms, submit" hx-indicator="#search-indicator" class="grid grid-cols-1 gap-4 md:grid-cols-12">
            <div class="md:col-span-4">
                <label class="mb-1.5 block text-xs font-medium text-zinc-700">Search</label>
                <div class="relative">
                    <input type="text" name="q" value="{{ query }}" placeholder="Search by name, sku, description..." class="w-full rounded-lg border border-zinc-300 bg-white px-4 py-2.5 pl-10 text-sm placeholder-zinc-400 focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900 focus:outline-none" hx-get="/search/" hx-trigger="keyup changed delay:300ms" hx-target="#product-table-container" hx-include="#filter-form">
                    <svg class="absolute left-3 top-3 h-4 w-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <span id="search-indicator" class="htmx-indicator absolute right-3 top-3"><svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg></span>
                </div>
            </div>
            <div class="md:col-span-2">
                <label class="mb-1.5 block text-xs font-medium text-zinc-700">Category</label>
                <select name="category" class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2.5 text-sm focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900 focus:outline-none">
                    <option value="">All Categories</option>
                    <option value="ELECTRONICS" {% if category == "ELECTRONICS" %}selected{% endif %}>Electronics</option>
                    <option value="CLOTHING" {% if category == "CLOTHING" %}selected{% endif %}>Clothing</option>
                    <option value="HOME" {% if category == "HOME" %}selected{% endif %}>Home</option>
                    <option value="BOOKS" {% if category == "BOOKS" %}selected{% endif %}>Books</option>
                    <option value="OTHER" {% if category == "OTHER" %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="md:col-span-2">
                <label class="mb-1.5 block text-xs font-medium text-zinc-700">Min Price</label>
                <input type="number" name="min_price" value="{{ min_price }}" step="0.01" min="0" placeholder="$0" class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2.5 text-sm focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900 focus:outline-none">
            </div>
            <div class="md:col-span-2">
                <label class="mb-1.5 block text-xs font-medium text-zinc-700">Max Price</label>
                <input type="number" name="max_price" value="{{ max_price }}" step="0.01" min="0" placeholder="$999" class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2.5 text-sm focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900 focus:outline-none">
            </div>
            <div class="md:col-span-1">
                <label class="mb-1.5 block text-xs font-medium text-zinc-700">Stock</label>
                <select name="in_stock" class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2.5 text-sm focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900 focus:outline-none">
                    <option value="">All</option>
                    <option value="true" {% if in_stock == "true" %}selected{% endif %}>In Stock</option>
                    <option value="false" {% if in_stock == "false" %}selected{% endif %}>Out</option>
                </select>
            </div>
            <div class="md:col-span-1">
                <label class="mb-1.5 block text-xs font-medium text-zinc-700">Sort</label>
                <select name="sort_by" class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2.5 text-sm focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900 focus:outline-none">
                    <option value="-created_at" {% if sort_by == "-created_at" %}selected{% endif %}>Newest</option>
                    <option value="created_at" {% if sort_by == "created_at" %}selected{% endif %}>Oldest</option>
                    <option value="name" {% if sort_by == "name" %}selected{% endif %}>A-Z</option>
                    <option value="-name" {% if sort_by == "-name" %}selected{% endif %}>Z-A</option>
                    <option value="price" {% if sort_by == "price" %}selected{% endif %}>Price ↑</option>
                    <option value="-price" {% if sort_by == "-price" %}selected{% endif %}>Price ↓</option>
                </select>
            </div>
        </form>
    </div>

    <div id="product-table-container">
        {% include "products/partials/product_table.html" %}
    </div>
</div>
{% endblock %}
